name: CodeQL

on:
  push:
    branches: [ "main" ]
    paths: [ "**/*.swift", ".github/workflows/codeql.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "**/*.swift", ".github/workflows/codeql.yml" ]
  schedule:
    - cron: "27 4 * * 1"   # Mondays 04:27 UTC

# Least privilege: only what CodeQL needs to upload results.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    # Swift analysis requires a macOS runner with a matching Xcode/SDK.
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      security-events: write   # upload SARIF to the Security tab
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest available Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: swift
          build-mode: manual

      # Ad-hoc signing so the build needs no Apple Developer team (matches the
      # community-fork build path); CodeQL observes this compile.
      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project Edward.xcodeproj -scheme Edward -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: "/language:swift"
